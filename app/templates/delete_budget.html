{% extends 'base.html' %}
{% block title %}Delete Budget — Budget Buddy{% endblock %}
{% block content %}
<h1>Delete budget</h1>
<div class="card">
    <p>Are you sure you want to delete the budget for <strong>{{ budget[1] }}</strong>?</p>
    <p style="margin-top:0.5rem;color:var(--text-muted)">{{ budget[3] }} to {{ budget[4] }}</p>
</div>
<div style="display:flex;gap:1rem;margin-top:1rem">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
    <a href="/budgets" class="btn">Cancel</a>
</div>
{% endblock %}

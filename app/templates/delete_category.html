{% extends 'base.html' %}
{% block title %}Delete Category — Budget Buddy{% endblock %}
{% block content %}
<h1>Delete category</h1>
<div class="card">
    <p>Are you sure you want to delete <strong>{{ category[1] }}</strong>?</p>
    <p style="margin-top:0.5rem;color:var(--text-muted)">This will fail if any transactions or budgets are still using this category.</p>
</div>
<div style="display:flex;gap:1rem;margin-top:1rem">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
    <a href="/categories" class="btn">Cancel</a>
</div>
{% endblock %}

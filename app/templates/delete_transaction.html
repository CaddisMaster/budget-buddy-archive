<!DOCTYPE html>
<html>
<head><title>Delete Transaction</title></head>
<body>
    <h1>Delete transaction</h1>
    <p>Are you sure you want to delete this transaction?</p>
    <p><strong>{{ transaction[4] }}</strong> — ${{ "%.2f"|format(transaction[1]) }} on {{ transaction[3] }}</p>
    <form method="post">
        <button type="submit">Yes, delete</button>
    </form>
    <a href="/transactions">Cancel</a>
</body>
</html>

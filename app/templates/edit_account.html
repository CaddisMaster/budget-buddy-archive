{% extends 'base.html' %}
{% block title %}Edit Account — Budget Buddy{% endblock %}
{% block content %}
<h1>Edit account</h1>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name</label>
    <input type="text" name="name" value="{{ account[1] }}" required>
    <label>Type</label>
    <select name="type" required>
        <option value="Credit Card" {% if account[2] == 'Credit Card' %}selected{% endif %}>Credit Card</option>
        <option value="Debit Card" {% if account[2] == 'Debit Card' %}selected{% endif %}>Debit Card</option>
        <option value="Bank Account" {% if account[2] == 'Bank Account' %}selected{% endif %}>Bank Account</option>
    </select>
    <div style="display:flex;gap:1rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="/accounts" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}

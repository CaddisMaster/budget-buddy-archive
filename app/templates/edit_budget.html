{% extends 'base.html' %}
{% block title %}Edit Budget — Budget Buddy{% endblock %}
{% block content %}
<h1>Edit budget</h1>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Category</label>
    <select name="category_id" required>
        {% for cat in categories %}
        <option value="{{ cat[0] }}" {% if cat[0] == budget[1] %}selected{% endif %}>{{ cat[1] }}</option>
        {% endfor %}
    </select>
    <label>Amount</label>
    <input type="number" step="0.01" name="amount" value="{{ budget[2] }}" required>
    <label>Period start</label>
    <input type="date" name="period_start" value="{{ budget[3] }}" required>
    <label>Period end</label>
    <input type="date" name="period_end" value="{{ budget[4] }}" required>
    <div style="display:flex;gap:1rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="/budgets" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}


<!DOCTYPE html>
<html>
<head><title>Edit Budget</title></head>
<body>
    <h1>Edit budget</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% endwith %}
    <form method="post">
        <label>Category:
            <select name="category_id" required>
                {% for cat in categories %}
                <option value="{{ cat[0] }}" {% if cat[0] == budget[1] %}selected{% endif %}>{{ cat[1] }}</option>
                {% endfor %}
            </select>
        </label><br>
        <label>Amount: <input type="number" step="0.01" name="amount" value="{{ budget[2] }}" required></label><br>
        <label>Period start: <input type="date" name="period_start" value="{{ budget[3] }}" required></label><br>
        <label>Period end: <input type="date" name="period_end" value="{{ budget[4] }}" required></label><br>
        <button type="submit">Save changes</button>
    </form>
    <a href="/budgets">Cancel</a>
</body>
</html>

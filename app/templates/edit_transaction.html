{% extends 'base.html' %}
{% block title %}Edit Transaction — Budget Buddy{% endblock %}
{% block content %}
<h1>Edit transaction</h1>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Type</label>
    <select name="transaction_type" required>
        <option value="expense" {% if transaction[6] == 'expense' %}selected{% endif %}>Expense</option>
        <option value="income" {% if transaction[6] == 'income' %}selected{% endif %}>Income</option>
    </select>
    <label>Amount</label>
    <input type="number" step="0.01" name="amount" value="{{ transaction[1] }}" required>
    <label>Description</label>
    <input type="text" name="description" value="{{ transaction[2] }}">
    <label>Date</label>
    <input type="date" name="transaction_date" value="{{ transaction[3] }}" required>
    <label>Category</label>
    <select name="category_id">
        <option value="">-- no category --</option>
        {% for cat in categories %}
        <option value="{{ cat[0] }}" {% if cat[0] == transaction[4] %}selected{% endif %}>{{ cat[1] }}</option>
        {% endfor %}
    </select>
    <label>Account</label>
    <select name="account_id">
        <option value="">-- no account --</option>
        {% for acc in accounts %}
        <option value="{{ acc[0] }}" {% if acc[0] == transaction[5] %}selected{% endif %}>{{ acc[1] }}</option>
        {% endfor %}
    </select>
    <div style="display:flex;gap:1rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="/transactions" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}

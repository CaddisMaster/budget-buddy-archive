{% extends 'base.html' %}
{% block title %}Edit Transfer — Budget Buddy{% endblock %}
{% block content %}
<h1>Edit transfer</h1>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>From account</label>
    <select name="from_account" required>
        {% for account in accounts %}
        <option value="{{ account[0] }}" {% if account[0] == transfer.from_account %}selected{% endif %}>{{ account[1] }}</option>
        {% endfor %}
    </select>
    <label>To account</label>
    <select name="to_account" required>
        {% for account in accounts %}
        <option value="{{ account[0] }}" {% if account[0] == transfer.to_account %}selected{% endif %}>{{ account[1] }}</option>
        {% endfor %}
    </select>
    <label>Amount</label>
    <input type="number" step="0.01" name="amount" value="{{ transfer.amount }}" required>
    <label>Description</label>
    <input type="text" name="description" value="{{ transfer.description }}">
    <label>Date</label>
    <input type="date" name="transfer_date" value="{{ transfer.transfer_date }}" required>
    <div style="display:flex;gap:1rem;margin-top:1rem">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="/transactions" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}

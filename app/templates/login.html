<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Budget Buddy</title>
  {# PWA head tags (v10.13) — mirrors base.html, which this page doesn't extend. #}
  <meta name="theme-color" content="#378ADD">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  {# css_v = automatic content hash (app/__init__.py) — same value as base.html. #}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_v }}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">
  <div style="width:100%;max-width:380px;padding:2rem">
    <h1 style="margin-bottom:1.5rem">Budget Buddy</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Sign in</button>
    </form>
  </div>
</body>
</html>

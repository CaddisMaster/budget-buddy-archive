<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Budget Buddy</title>
  {# Keep the ?v= in lockstep with base.html — test_param_hardening enforces it. #}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=13">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">
  <div style="width:100%;max-width:380px;padding:2rem">
    <h1 style="margin-bottom:1.5rem">Budget Buddy</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Sign in</button>
    </form>
  </div>
</body>
</html>

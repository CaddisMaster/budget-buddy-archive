<!DOCTYPE html>
<html>
<head><title>Add Transaction</title></head>
<body>
    <h1>Add Transaction</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% endwith %}
    <form method="post">
        <label>Amount: <input type="number" step="0.01" name="amount" required></label><br>
        <label>Description: <input type="text" name="description"></label><br>
        <label>Date: <input type="date" name="transaction_date" required></label><br>
        <button type="submit">Add Transaction</button>
    </form>
    <a href="/">Back to home</a>
</body>
</html>

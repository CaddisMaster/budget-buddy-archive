<!DOCTYPE html>
<html>
<head><title>Add Transaction</title></head>
<body>
    <h1>Add Transaction</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% endwith %}
    <form method="post">
        <label>Type:
        <select name="transaction_type" required>
            <option value="">-- select type --</option>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
        </label><br>
        <label>Amount: <input type="number" step="0.01" name="amount" required></label><br>
        <label>Description: <input type="text" name="description"></label><br>
        <label>Category:
            <select name="category_id">
                <option value="">-- select category --</option>
                {% for cat in categories %}
                <option value="{{ cat[0] }}">{{ cat[1] }}</option>
                {% endfor %}
            </select>
        </label><br>
        <label>Account:
            <select name="account_id">
                <option value="">-- select account --</option>
                {% for account in accounts %}
                <option value="{{ account[0] }}">{{ account[1] }}</option>
                {% endfor %}
            </select>
        </label><br>
        <label>Date: <input type="date" name="transaction_date" required></label><br>
        <button type="submit">Add Transaction</button>
    </form>
    <a href="/">Back to home</a>
</body>
</html>

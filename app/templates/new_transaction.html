{% extends 'base.html' %}
{% block title %}Add Transaction — Budget Buddy{% endblock %}
{% block content %}
<h1>Add transaction</h1>
<form method="post">
    <label>Type</label>
    <select name="transaction_type" required>
        <option value="">-- select type --</option>
        <option value="expense">Expense</option>
        <option value="income">Income</option>
    </select>
    <label>Amount</label>
    <input type="number" step="0.01" name="amount" required>
    <label>Description</label>
    <input type="text" name="description">
    <label>Category</label>
    <select name="category_id">
        <option value="">-- select category --</option>
        {% for cat in categories %}
        <option value="{{ cat[0] }}">{{ cat[1] }}</option>
        {% endfor %}
    </select>
    <label>Account</label>
    <select name="account_id">
        <option value="">-- select account --</option>
        {% for account in accounts %}
        <option value="{{ account[0] }}">{{ account[1] }}</option>
        {% endfor %}
    </select>
    <label>Date</label>
    <input type="date" name="transaction_date" required>
    <label>Recurring</label>
    <select name="is_recurring" id="recurringSelect" onchange="toggleFrequency()">
        <option value="false">No</option>
        <option value="true">Yes</option>
    </select>
    <div id="frequencyDiv" style="display:none">
        <label>Frequency</label>
        <select name="frequency">
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top:1rem">Add transaction</button>
</form>
<script>
function toggleFrequency() {
    const val = document.getElementById('recurringSelect').value;
    document.getElementById('frequencyDiv').style.display = val === 'true' ? 'block' : 'none';
}
</script>
{% endblock %}

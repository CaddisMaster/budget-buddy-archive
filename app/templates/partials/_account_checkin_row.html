<tr id="account-{{ account[0] }}" class="editing">
  <td>{{ account[1] }}</td>
  <td>{{ account[2] }}</td>
  <td class="{% if account[3] >= 0 %}income{% else %}expense{% endif %}">
    App says ${{ "%.2f"|format(account[3]) }}
  </td>
  <td>
    <input type="number" name="actual_balance" step="0.01" required
      placeholder="Bank says…" aria-label="Actual bank balance"
      style="max-width:9rem">
  </td>
  <td class="row-actions">
    <button type="button" class="btn btn-sm btn-primary"
      hx-post="/accounts/{{ account[0] }}/checkin" hx-include="closest tr"
      hx-target="#account-{{ account[0] }}" hx-swap="outerHTML">Check in</button>
    <button type="button" class="btn btn-sm"
      hx-get="/accounts/{{ account[0] }}/row"
      hx-target="#account-{{ account[0] }}" hx-swap="outerHTML">Cancel</button>
    {% if error %}<span class="inline-error">{{ error }}</span>{% endif %}
  </td>
</tr>

<tr id="category-{{ cat[0] }}" class="editing">
  <td><input type="text" name="name" value="{{ cat[1] }}" required></td>
  <td><input type="text" name="description" value="{{ cat[2] or '' }}"></td>
  <td class="row-actions">
    <button type="button" class="btn btn-sm btn-primary"
      hx-post="/categories/{{ cat[0] }}/edit" hx-include="closest tr"
      hx-target="#category-{{ cat[0] }}" hx-swap="outerHTML">Save</button>
    <button type="button" class="btn btn-sm"
      hx-get="/categories/{{ cat[0] }}/row"
      hx-target="#category-{{ cat[0] }}" hx-swap="outerHTML">Cancel</button>
    {% if error %}<span class="inline-error">{{ error }}</span>{% endif %}
  </td>
</tr>

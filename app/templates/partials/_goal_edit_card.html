<div class="card editing" id="goal-{{ goal[0] }}" style="margin-bottom:1rem">
    <label>Name</label>
    <input type="text" name="name" maxlength="80" value="{{ goal[1] }}" required>
    <label>Target amount</label>
    <input type="number" step="0.01" name="target_amount" value="{{ goal[2] }}" required>
    <label>Target date (optional)</label>
    <input type="date" name="target_date" value="{{ goal[3] if goal[3] else '' }}">
    <label>Linked account</label>
    <select name="account_id" required>
        {% for account in accounts %}
        <option value="{{ account[0] }}" {% if account[0] == goal[4] %}selected{% endif %}>{{ account[1] }}</option>
        {% endfor %}
    </select>
    <div class="row-actions" style="margin-top:1rem">
        <button type="button" class="btn btn-sm btn-primary"
          hx-post="/goals/{{ goal[0] }}/edit" hx-include="closest .card"
          hx-target="#goal-{{ goal[0] }}" hx-swap="outerHTML">Save changes</button>
        <button type="button" class="btn btn-sm"
          hx-get="/goals/{{ goal[0] }}/card"
          hx-target="#goal-{{ goal[0] }}" hx-swap="outerHTML">Cancel</button>
    </div>
    {% if errors %}<p class="inline-error" style="margin-top:0.5rem">{{ errors|join('; ') }}</p>{% endif %}
</div>

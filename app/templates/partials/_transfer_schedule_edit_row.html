{# Inline edit row. Both the semi-monthly day inputs and the Next-date input are
   shown (no per-row JS); the server uses whichever fits the chosen frequency.
   Tuple shape matches _transfer_schedule_row.html. #}
<tr id="transfer-schedule-{{ schedule[0] }}" class="editing">
  <td>
    <select name="from_account" required>
      {% for account in accounts %}
      <option value="{{ account[0] }}" {% if schedule[3] == account[0] %}selected{% endif %}>{{ account[1] }}</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <select name="to_account" required>
      {% for account in accounts %}
      <option value="{{ account[0] }}" {% if schedule[4] == account[0] %}selected{% endif %}>{{ account[1] }}</option>
      {% endfor %}
    </select>
  </td>
  <td><input type="number" step="0.01" name="amount" value="{{ schedule[1] }}" required style="width:6rem"></td>
  <td><input type="text" name="description" value="{{ schedule[2] or '' }}"></td>
  <td>
    <select name="frequency" required>
      <option value="weekly" {% if schedule[5] == 'weekly' %}selected{% endif %}>Weekly</option>
      <option value="biweekly" {% if schedule[5] == 'biweekly' %}selected{% endif %}>Bi-weekly</option>
      <option value="semimonthly" {% if schedule[5] == 'semimonthly' %}selected{% endif %}>Semi-monthly</option>
      <option value="monthly" {% if schedule[5] == 'monthly' %}selected{% endif %}>Monthly</option>
      <option value="quarterly" {% if schedule[5] == 'quarterly' %}selected{% endif %}>Quarterly</option>
      <option value="annually" {% if schedule[5] == 'annually' %}selected{% endif %}>Annually</option>
    </select>
  </td>
  <td>
    <label style="font-size:11px;color:var(--text-muted);font-weight:normal;margin:0">Days (semi-monthly)</label>
    <div style="display:flex;gap:0.25rem;align-items:center">
      <input type="number" name="anchor_day" min="1" max="31" value="{{ schedule[6] if schedule[6] is not none else '' }}" style="width:3.5rem;margin:0" placeholder="1">
      <input type="number" name="second_day" min="1" max="31" value="{{ schedule[7] if schedule[7] is not none else '' }}" style="width:3.5rem;margin:0" placeholder="15">
    </div>
    <label style="font-size:11px;color:var(--text-muted);font-weight:normal;margin:0.25rem 0 0">Next date (other)</label>
    <input type="date" name="next_due" value="{{ schedule[8].strftime('%Y-%m-%d') if schedule[8] else '' }}" style="margin:0">
  </td>
  <td class="row-actions">
    <button type="button" class="btn btn-sm btn-primary"
      hx-post="/transfers/recurring/{{ schedule[0] }}/edit" hx-include="closest tr"
      hx-target="#transfer-schedule-{{ schedule[0] }}" hx-swap="outerHTML">Save</button>
    <button type="button" class="btn btn-sm"
      hx-get="/transfers/recurring/{{ schedule[0] }}/row"
      hx-target="#transfer-schedule-{{ schedule[0] }}" hx-swap="outerHTML">Cancel</button>
    {% if error %}<span class="inline-error">{{ error }}</span>{% endif %}
  </td>
</tr>

{# Inline edit row. Both the semi-monthly day inputs and the Next-date input are
   shown (no per-row JS); the server uses whichever fits the chosen frequency.
   Row shape (TRANSFER_SCHEDULE_ROW_SQL namedtuple) matches _transfer_schedule_row.html. #}
<tr id="transfer-schedule-{{ schedule.id }}" class="editing">
  <td>
    <select name="from_account" required>
      {% for account in accounts %}
      <option value="{{ account.account_id }}" {% if schedule.from_account_id == account.account_id %}selected{% endif %}>{{ account.account_name }}</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <select name="to_account" required>
      {% for account in accounts %}
      <option value="{{ account.account_id }}" {% if schedule.to_account_id == account.account_id %}selected{% endif %}>{{ account.account_name }}</option>
      {% endfor %}
    </select>
  </td>
  <td><input type="number" step="0.01" name="amount" value="{{ schedule.amount }}" required style="width:6rem"></td>
  <td><input type="text" name="description" value="{{ schedule.description or '' }}"></td>
  <td>
    <select name="frequency" required>
      <option value="weekly" {% if schedule.frequency == 'weekly' %}selected{% endif %}>Weekly</option>
      <option value="biweekly" {% if schedule.frequency == 'biweekly' %}selected{% endif %}>Bi-weekly</option>
      <option value="semimonthly" {% if schedule.frequency == 'semimonthly' %}selected{% endif %}>Semi-monthly</option>
      <option value="monthly" {% if schedule.frequency == 'monthly' %}selected{% endif %}>Monthly</option>
      <option value="quarterly" {% if schedule.frequency == 'quarterly' %}selected{% endif %}>Quarterly</option>
      <option value="annually" {% if schedule.frequency == 'annually' %}selected{% endif %}>Annually</option>
    </select>
  </td>
  <td>
    <label style="font-size:11px;color:var(--text-muted);font-weight:normal;margin:0">Days (semi-monthly)</label>
    <div style="display:flex;gap:0.25rem;align-items:center">
      <input type="number" name="anchor_day" min="1" max="31" value="{{ schedule.anchor_day if schedule.anchor_day is not none else '' }}" style="width:3.5rem;margin:0" placeholder="1">
      <input type="number" name="second_day" min="1" max="31" value="{{ schedule.second_day if schedule.second_day is not none else '' }}" style="width:3.5rem;margin:0" placeholder="15">
    </div>
    <label style="font-size:11px;color:var(--text-muted);font-weight:normal;margin:0.25rem 0 0">Next date (other)</label>
    <input type="date" name="next_due" value="{{ schedule.next_due.strftime('%Y-%m-%d') if schedule.next_due else '' }}" style="margin:0">
  </td>
  <td class="row-actions">
    <button type="button" class="btn btn-sm btn-primary"
      hx-post="{{ url_for('transfers.edit_transfer_schedule', schedule_id=schedule.id) }}" hx-include="closest tr"
      hx-target="#transfer-schedule-{{ schedule.id }}" hx-swap="outerHTML">Save</button>
    <button type="button" class="btn btn-sm"
      hx-get="{{ url_for('transfers.transfer_schedule_row', schedule_id=schedule.id) }}"
      hx-target="#transfer-schedule-{{ schedule.id }}" hx-swap="outerHTML">Cancel</button>
    {% if error %}<span class="inline-error">{{ error }}</span>{% endif %}
  </td>
</tr>

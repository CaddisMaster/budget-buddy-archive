<tr id="user-{{ u.id }}">
    <td>{{ u.username }}{% if u.id == current_user.id %} <span class="suggested-tag">(you)</span>{% endif %}</td>
    <td>{{ 'Admin' if u.is_admin else 'User' }}</td>
    <td>{{ u.created_at.strftime('%Y-%m-%d') if u.created_at else '—' }}</td>
    <td class="row-actions">
        {% if u.id != current_user.id %}
        <button type="button" class="btn btn-sm"
            hx-post="{{ url_for('admin.toggle_admin', user_id=u.id) }}"
            hx-target="#user-{{ u.id }}" hx-swap="outerHTML">{{ 'Remove admin' if u.is_admin else 'Make admin' }}</button>
        <button type="button" class="btn btn-sm btn-danger"
            hx-delete="{{ url_for('admin.delete_user', user_id=u.id) }}"
            hx-target="#user-{{ u.id }}" hx-swap="outerHTML"
            hx-confirm="Delete {{ u.username }} and all their data?">Delete</button>
        {% else %}—{% endif %}
    </td>
</tr>

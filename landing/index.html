<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sean DeSmet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    h1 { font-size: 2rem; font-weight: 500; margin-bottom: 0.5rem; }
    p.subtitle { color: #666; margin-bottom: 3rem; font-size: 1rem; }
    .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; width: 100%; max-width: 800px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1.5rem; text-decoration: none; color: inherit; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; }
    .card p { font-size: 0.9rem; color: #666; line-height: 1.6; }
    .card .tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: #f0f0f0; color: #444; margin-top: 1rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f0f0f0; }
      .card { background: #242424; border-color: #333; }
      .card p, p.subtitle { color: #aaa; }
      .card .tag { background: #333; color: #ccc; }
    }
  </style>
</head>
<body>
  <h1>Sean DeSmet</h1>
  <p class="subtitle">Full stack projects</p>
  <div class="projects">
    <a href="https://budget.seandesmet.com" class="card">
      <h2>Budget Buddy</h2>
      <p>Personal budget tracking and ledger system with analytics, recurring transactions, and dashboard.</p>
      <span class="tag">Flask · PostgreSQL · Docker</span>
    </a>
  </div>
</body>
</html>
